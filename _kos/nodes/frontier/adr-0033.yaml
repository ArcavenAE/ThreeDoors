id: adr-0033
type: element
confidence: frontier
title: "Project-level work tracking — deferred"
content: |
  Cross-project work tracking is deferred until a second active project
  exists. No point building multi-project infrastructure when there is
  only one project to track.

  Harvest 2026-11-17 (I-532): part of ADR-0033's reasoning has changed. Its
  first reason is "ThreeDoors is the only project without an -orc orchestrator",
  and ThreeDoors is now a subrepo of an orchestrator (aae-orc CLAUDE.md, line 79).
  The ADR's Re-entry Gate (docs/ADRs/ADR-0033-project-level-tracking-deferred.md,
  lines 29 to 34) lists three conditions: "A second project under orc becomes
  actively developed with agents"; "The live mutex question (Decision 18's
  "per-project tracking location") has a concrete answer"; and "The human
  authority model for admitting changes is defined". The change above bears on
  the first. This harvest does not judge whether any of the three is met; that is
  the owner's call. The ADR still reads "Status: Deferred" and no later ADR
  revisits it. No confidence change.
edges:
